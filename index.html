<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ma première page publiée avec GitHub Pages.">
  <title>Ma première page — Coucou</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f7fb;
      color: #172033;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 15% 15%, rgba(75, 119, 255, .14), transparent 32rem),
        radial-gradient(circle at 85% 85%, rgba(27, 183, 164, .13), transparent 28rem),
        #f4f7fb;
    }
    main {
      width: min(100%, 720px);
      padding: clamp(32px, 7vw, 64px);
      border: 1px solid rgba(30, 48, 80, .10);
      border-radius: 28px;
      background: rgba(255, 255, 255, .88);
      box-shadow: 0 24px 80px rgba(24, 42, 78, .10);
      text-align: center;
    }
    .eyebrow {
      display: inline-block;
      margin-bottom: 18px;
      padding: 8px 13px;
      border-radius: 999px;
      background: #edf2ff;
      color: #3659bd;
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(3rem, 10vw, 5.5rem);
      line-height: 1;
      letter-spacing: -.065em;
    }
    p {
      max-width: 46ch;
      margin: 22px auto 0;
      color: #5b667b;
      font-size: 1.08rem;
      line-height: 1.7;
    }
    footer {
      margin-top: 38px;
      color: #8791a4;
      font-size: .88rem;
    }
  </style>
</head>
<body>
  <main>
    <span class="eyebrow">Mon premier site · GitHub Pages</span>
    <h1>Coucou 👋</h1>
    <p>Bienvenue sur ma première page web publiée avec Git et GitHub Pages.</p>
    <footer>Créé dans le cadre du projet de L1 Informatique · 2026/2027</footer>
  </main>
</body>
</html>
